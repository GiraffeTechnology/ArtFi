name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:secrets
      - run: node --test scripts/test/ctyun-ci-policy.test.mjs
      - run: pnpm agent:test
      - run: pnpm release:verify-schema
      - run: pnpm hoodi-admin-safe:verify-schema
      - run: pnpm hoodi-admin-safe:verifier:test
      - run: pnpm mint:verify-schema
      - run: pnpm mint:verifier:test
      - run: pnpm charity-edition:verify-schema
      - run: pnpm charity-edition:verifier:test
      - run: pnpm charity-edition:ye-yongrun:verify
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: false
      - run: gofmt -w . && git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:format:check
      - run: pnpm contracts:lint
      - run: pnpm contracts:build
      - run: pnpm contracts:test
      - run: pnpm contracts:deploy-tooling:check
      - run: pnpm chain:consistency:check

  migration:
    runs-on: ubuntu-latest
    steps:
      - name: Require the approved CTYun database executor
        run: |
          echo "CTYUN_DB_EXECUTION_NOT_CONFIGURED: migration acceptance remains blocked."
          echo "No local MySQL is started. See docs/CTYUN_DATABASE_CI_GATE.md."
          exit 1

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @giraffetechnology/artfi-web exec playwright install --only-shell chromium
      - run: pnpm test:e2e
