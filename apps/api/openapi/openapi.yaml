              balance: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
              updatedAt: { type: string, format: date-time }
        transactions:
          type: array
          items: { type: object }
        offers:
          type: array
          items: { type: object }
        notifications:
          type: array
          items: { type: object }
    ChainEventRequest:
      type: object
      additionalProperties: false
      required:
        [
          chainId,
          transactionHash,
          logIndex,
          blockNumber,
          blockHash,
          contractAddress,
          eventName,
          payload,
          removed,
          confirmations,
        ]
      properties:
        chainId: { type: integer, const: 560048 }
        transactionHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        logIndex: { type: integer, minimum: 0 }
        blockNumber: { type: integer, minimum: 0 }
        blockHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        contractAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        eventName: { type: string, minLength: 2, maxLength: 80 }
        payload: { type: object }
        removed: { type: boolean }
        confirmations: { type: integer, minimum: 0 }
    ExternalMarketEventRequest:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          source,
          eventType,
          eventFamily,
          entityKey,
          version,
          chain,
          eventTimestamp,
          payload,
        ]
      properties:
        schemaVersion: { type: string, const: "1" }
        source: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }
        eventType: { type: string, maxLength: 48 }
        eventFamily: { type: string, enum: [order, sale, transfer, metadata] }
        entityKey: { type: string, maxLength: 196 }
        version: { type: integer, minimum: 1 }
        chain: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }
        collectionSlug: { type: string, maxLength: 160 }
        orderHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        transactionHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        contractAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        tokenId: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
        makerAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        price: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
        paymentTokenAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        paymentSymbol: { type: string, maxLength: 16 }
        marketplaceUrl: { type: string, format: uri }
        eventTimestamp: { type: string, format: date-time }
        payload: { type: object }
    CurrentMarketListing:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          source,
          chain,
          contractAddress,
          tokenId,
          observedAtMs,
          status,
        ]
      description: Public token-bound observation. Active/inactive/fulfilled/expired/cancelled require orderHash, price, currency, decimals and validUntilMs; not-found/unavailable must omit them. Token and price decimals must fit uint256. These are provider reports, not execution or ownership guarantees.
      properties:
        schemaVersion: { type: string, const: "1" }
        source: { type: string, const: opensea }
        chain: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }
        contractAddress: { type: string, pattern: "^0x[0-9a-f]{40}$" }
        tokenId: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
        collectionSlug:
          { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,159}$" }
        observedAtMs: { type: integer, minimum: 1 }
        status:
          {
            type: string,
            enum:
              [
                active,
                inactive,
                fulfilled,
                expired,
                cancelled,
                not-found,
                unavailable,
              ],
          }
        orderHash: { type: string, pattern: "^0x[0-9a-f]{64}$" }
        price: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
        currency: { type: string, pattern: "^[A-Za-z0-9._-]{1,32}$" }
        decimals: { type: integer, minimum: 0, maximum: 36 }
        validUntilMs: { type: integer, minimum: 1, maximum: 9007199254740991 }
    MarketStreamRequest:
      type: object
      additionalProperties: false
      required:
        [schemaVersion, source, collections, transportState, observedAtMs]
      properties:
        schemaVersion: { type: string, const: "1" }
        source: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }
        collections:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,159}$" }
        transportState:
          { type: string, enum: [connecting, connected, disconnected, stopped] }
        observedAtMs:
          type: integer
          minimum: 1
          description: Collector UTC epoch milliseconds, within five minutes behind and five seconds ahead of the API clock.
    MarketStreamObservation:
      type: object
      required:
        [
          source,
          collectionSlug,
          transportState,
          freshness,
          observedAt,
          receivedAt,
        ]
      properties:
        source: { type: string }
        collectionSlug: { type: string }
        transportState:
          { type: string, enum: [connecting, connected, disconnected, stopped] }
        freshness: { type: string, enum: [fresh, stale] }
        observedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
    MarketObservationRequest:
      type: object
      additionalProperties: false
      required: [schemaVersion, source, collections, status, observedAtMs]
      properties:
        schemaVersion: { type: string, const: "1" }
        source: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }
        collections:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,159}$" }
        status: { type: string, enum: [complete, unavailable] }
        observedAtMs:
          type: integer
          minimum: 1
          description: Collector UTC epoch milliseconds, within five minutes behind and five seconds ahead of the API clock.
        completedThrough:
          type: integer
          minimum: 0
          description: Required positive UTC epoch seconds for complete, no later than observedAtMs. Omit or use zero for unavailable.
    MarketObservation:
      type: object
      required: [source, collectionSlug, status, observedAt, receivedAt]
      properties:
        source: { type: string }
        collectionSlug: { type: string }
        status: { type: string, enum: [fresh, stale, unavailable] }
        observedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }
        lastSuccessAt: { type: string, format: date-time }
        completedThrough: { type: string, format: date-time }
    ExternalMarketActivity:
      allOf:
        - $ref: "#/components/schemas/ExternalMarketEventRequest"
        - type: object
          required: [eventId]
          properties:
            eventId: { type: string, pattern: "^[0-9a-f]{64}$" }
    ExternalMarketAsset:
      type: object
      required:
        [
          source,
          chain,
          contractAddress,
          tokenId,
          latestEventType,
          latestEventTimestamp,
        ]
      properties:
        source: { type: string }
        chain: { type: string }
        contractAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        tokenId: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
        collectionSlug: { type: string }
        latestEventType: { type: string }
        latestEventTimestamp: { type: string, format: date-time }
        orderHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        orderStatus:
          { type: string, enum: [active, cancelled, invalidated, fulfilled] }
        price: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
        paymentSymbol: { type: string }
        marketplaceUrl: { type: string, format: uri }
    ExternalMarketIntentRequest:
      type: object
      additionalProperties: false
      required: [source, action, chain, orderHash, walletAddress]
      properties:
        source: { type: string, const: opensea }
        action: { type: string, const: fulfill-listing }
        chain: { type: string }
        orderHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        walletAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
    ExternalMarketTransaction:
      type: object
      additionalProperties: false
      required: [chain, to, data, value]
      properties:
        chain: { type: string }
        to: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        data: { type: string, pattern: "^0x(?:[0-9a-fA-F]{2})*$" }
        value: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
        valueHex: { type: string, pattern: "^0x(?:[0-9a-fA-F]{2})*$" }
    ExternalMarketIntent:
      allOf:
        - $ref: "#/components/schemas/ExternalMarketIntentRequest"
        - type: object
          required:
            [
              intentId,
              contractAddress,
              tokenId,
              status,
              marketplaceUrl,
              transactions,
              createdAt,
              updatedAt,
            ]
          properties:
            intentId: { type: string, pattern: "^[0-9a-f]{32}$" }
            contractAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
            tokenId: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
            status:
              type: string
              enum:
                [
                  initiated,
                  awaiting-wallet,
                  submitted,
                  accepted,
                  rejected,
                  pending,
                  confirmed,
                  failed,
                  cancelled,
                ]
            marketplaceUrl: { type: string, format: uri }
            transactions:
              type: array
              maxItems: 1
              items: { $ref: "#/components/schemas/ExternalMarketTransaction" }
            transactionHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
            externalTransactionHash:
              { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
            failureCode: { type: string }
            externalEventTimestamp: { type: string, format: date-time }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, detail, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        requestId: { type: string }
