openapi: 3.1.0
info:
  title: ArtFi API
  version: 0.4.0
  description: Stage 4 Hoodi preview contract. Wallet intents never hold private keys; authenticated indexer writes are durable and replay-safe.
servers:
  - url: http://localhost:8080
paths:
  /v1/admin/session:
    get:
      operationId: administrationSession
      summary: Check deployment-configured application moderation permission
      description: Application content moderation only. No asset, custody, settlement, registry, seller-identity or trading privileges. All responses are no-store.
      responses:
        "200":
          description: Current records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdministrationSession"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
      security:
        - WalletUserSession: []
  /v1/admin/moderation/cases:
    get:
      operationId: adminModerationCases
      summary: List private content review and appeal queue
      description: Application content moderation only. No asset, custody, settlement, registry, seller-identity or trading privileges. All responses are no-store.
      responses:
        "200":
          description: Current records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationCasePage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
      security:
        - WalletUserSession: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum:
              - ""
              - open
              - reviewing
              - resolved
              - appealed
  /v1/admin/moderation/cases/{caseID}:
    get:
      operationId: adminModerationCase
      summary: Read a private moderation case
      description: Application content moderation only. No asset, custody, settlement, registry, seller-identity or trading privileges. All responses are no-store.
      responses:
        "200":
          description: Current records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationCase"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
      security:
        - WalletUserSession: []
      parameters:
        - name: caseID
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{32}$
  /v1/admin/moderation/cases/{caseID}/decisions:
    post:
      operationId: adminModerationDecision
      summary: Record a revision-checked moderation or appeal decision
      description: Requires a configured application moderator wallet. start_review applies to open reports; resolve to open/reviewing; uphold_appeal and reject_appeal to pending appeals. resolve/uphold require no_action with an empty publicNotice or content_warning with a 10–500 character publicNotice. Other actions require empty decision/publicNotice. A warning publishes only target and moderator-authored notice; private report and appeal text are never public. No state, receipt or audit is committed unless all succeed atomically.
      responses:
        "200":
          description: Durably recorded result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationCase"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
      security:
        - WalletUserSession: []
      parameters:
        - name: caseID
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{32}$
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,128}$
          description: Actor-scoped, durable replay key. Reuse only for the identical method, path and payload. A conflicting payload returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationDecision"
  /v1/user/moderation/cases:
    get:
      operationId: userModerationCases
      summary: List only the authenticated wallet’s reports and appeals
      description: Application content moderation only. No asset, custody, settlement, registry, seller-identity or trading privileges. All responses are no-store.
      responses:
        "200":
          description: Current records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationCasePage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
      security:
        - WalletUserSession: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum:
              - ""
              - open
              - reviewing
              - resolved
              - appealed
    post:
      operationId: createModerationReport
      summary: Submit a private marketplace-content report
      description: Application content moderation only. No asset, custody, settlement, registry, seller-identity or trading privileges. All responses are no-store.
      responses:
        "201":
          description: Durably recorded result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationCase"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
      security:
        - WalletUserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationReport"
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,128}$
          description: Actor-scoped, durable replay key. Reuse only for the identical method, path and payload. A conflicting payload returns 409.
  /v1/user/moderation/cases/{caseID}:
    get:
      operationId: userModerationCase
      summary: Read only a case owned by the authenticated wallet
      description: Application content moderation only. No asset, custody, settlement, registry, seller-identity or trading privileges. All responses are no-store.
      responses:
        "200":
          description: Current records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationCase"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
      security:
        - WalletUserSession: []
      parameters:
        - name: caseID
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{32}$
  /v1/user/moderation/cases/{caseID}/appeals:
    post:
      operationId: createModerationAppeal
      summary: Appeal a resolved report from its original reporter wallet
      description: One private appeal per resolved case. A current case revision is required. Other wallets receive 404 without case details. The existing content decision stays in effect while the appeal is pending. Authenticated ownership, revision, state, durable audit and idempotency are checked together.
      responses:
        "200":
          description: Durably recorded result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationCase"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
      security:
        - WalletUserSession: []
      parameters:
        - name: caseID
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{32}$
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,128}$
          description: Actor-scoped, durable replay key. Reuse only for the identical method, path and payload. A conflicting payload returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationAppeal"
  /v1/admin/config:
    get:
      operationId: adminPlatformConfiguration
      summary: Read service-notice configuration including an unpublished draft
      description: Application content moderation only. No asset, custody, settlement, registry, seller-identity or trading privileges. All responses are no-store.
      responses:
        "200":
          description: Current records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformConfiguration"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
      security:
        - WalletUserSession: []
    put:
      operationId: updatePlatformConfiguration
      summary: Update only the audited platform service notice
      description: Requires a configured moderator wallet, current revision and reason. noticeEnabled=true requires a 10–500 character notice. Security, roles, fees, trading, custody and execution settings are not mutable here. The service notice is applied by the web application on load and refresh.
      responses:
        "200":
          description: Durably recorded result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformConfiguration"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
      security:
        - WalletUserSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformConfigurationUpdate"
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{16,128}$
          description: Actor-scoped, durable replay key. Reuse only for the identical method, path and payload. A conflicting payload returns 409.
  /v1/admin/audit:
    get:
      operationId: administrationAudit
      summary: Read append-only moderation and configuration audit history
      description: Application content moderation only. No asset, custody, settlement, registry, seller-identity or trading privileges. All responses are no-store.
      responses:
        "200":
          description: Current records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdministrationAuditPage"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
      security:
        - WalletUserSession: []
      parameters:
        - name: before
          in: query
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: Exclusive audit ID cursor returned as nextCursor. At most 50 records per page.
  /v1/platform/config:
    get:
      operationId: publicPlatformConfiguration
      summary: Read the current public platform service notice
      description: No wallet required. Disabled draft text is omitted as an empty noticeText. No secrets or operational authority are returned.
      responses:
        "200":
          description: Current records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformConfiguration"
        "400":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/moderation/notices:
    get:
      operationId: publicModerationNotices
      summary: Read published content notices without reporter or appeal data
      description: Only the content reference, moderator-authored notice, case ID and update time are public. A notice remains during appeal and is removed when an upheld appeal replaces the decision with no_action. Notices do not alter orders, balances, settlement or property rights.
      responses:
        "200":
          description: Current records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationNoticePage"
        "400":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
  /v1/nft/operations/history:
    post:
      summary: Read the authenticated wallet's native NFT operation history
      description: Internal bridge credential and current wallet access token required. Returns paginated unsigned summaries scoped to the session wallet and chain, never wallet signatures or full review payloads.
      operationId: nftOperationHistory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [accessToken, page]
              properties:
                accessToken: { type: string, writeOnly: true, maxLength: 4096 }
                page: { type: integer, minimum: 1, maximum: 1000000 }
      responses:
        "200":
          description: Current wallet's operation summaries, newest first, 25 per page
          content:
            application/json:
              schema:
                type: object
                required: [data, page, pageSize, hasMore, wallet, chainId]
                properties:
                  data:
                    type: array
                    maxItems: 25
                    items:
                      type: object
                      required:
                        [
                          id,
                          chainId,
                          status,
                          action,
                          collection,
                          tokenId,
                          kind,
                          walletStarted,
                          updatedAt,
                        ]
                      properties:
                        id: { type: string }
                        chainId: { type: integer }
                        status: { type: string }
                        action: { type: string }
                        collection: { type: string }
                        tokenId: { type: string }
                        kind: { type: string }
                        walletStarted: { type: boolean }
                        transactionHash: { type: string }
                        orderHash: { type: string }
                        updatedAt: { type: string, format: date-time }
                  page: { type: integer }
                  pageSize: { type: integer, const: 25 }
                  hasMore: { type: boolean }
                  wallet: { type: string }
                  chainId: { type: integer }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/nft/operations:
    post:
      summary: Read or transition an authenticated native NFT operation
      description: Internal web-to-API bridge. Stores only unsigned review plans and transaction/order hashes. Server credentials and a current wallet access token are both required. Plans are immutable; updates use revision compare-and-swap. No wallet signature or raw signed transaction may be stored.
      operationId: nftOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, accessToken, operation]
              properties:
                action:
                  type: string
                  enum: [get, create, update]
                accessToken:
                  type: string
                  writeOnly: true
                  maxLength: 4096
                operation:
                  type: object
                  required: [id]
                  properties:
                    id:
                      type: string
                      pattern: "^[a-zA-Z0-9_-]{16,80}$"
                    wallet:
                      type: string
                    chainId:
                      type: integer
                    requestHash:
                      type: string
                      pattern: "^[a-f0-9]{64}$"
                    revision:
                      type: integer
                      minimum: 1
                    status:
                      type: string
                      enum:
                        [
                          awaiting-wallet,
                          submitted,
                          pending,
                          accepted,
                          rejected,
                          confirmed,
                          failed,
                          cancelled,
                        ]
                    plan:
                      type: object
                      description: Unsigned session-bound review plan. Credential and signature fields are rejected recursively.
                      additionalProperties: true
                    transactionHash:
                      type: string
                    orderHash:
                      type: string
      responses:
        "200":
          description: The authoritative operation and unsigned review plan
        "401":
          description: Missing or expired wallet session or invalid bridge credential
        "403":
          description: Operation belongs to another wallet or chain
        "404":
          description: Operation was not found
        "409":
          description: Idempotency, immutable-plan, or revision conflict
        "503":
          description: Durable operation journal is unavailable
  /v1/user/auth/challenge:
    post:
      operationId: walletUserChallenge
      description: Internal ordinary-session bridge endpoint. The browser uses the same-origin Next API. A verifier proof is accepted only from the configured bridge after cryptographic wallet-message verification. Login grants no sale or transfer authority.
      security:
        - WalletAuthBridge: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - address
                - chainId
                - origin
              properties:
                address:
                  type: string
                  pattern: ^0x[0-9a-fA-F]{40}$
                chainId:
                  type: integer
                  const: 560048
                origin:
                  type: string
                  format: uri
      responses:
        "200":
          description: Bounded server response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletUserChallenge"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/user/auth/verify:
    post:
      operationId: walletUserVerify
      description: Internal ordinary-session bridge endpoint. The browser uses the same-origin Next API. A verifier proof is accepted only from the configured bridge after cryptographic wallet-message verification. Login grants no sale or transfer authority.
      security:
        - WalletAuthBridge: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - challengeId
                - address
                - chainId
                - origin
                - message
              properties:
                challengeId:
                  type: string
                address:
                  type: string
                  pattern: ^0x[0-9a-fA-F]{40}$
                chainId:
                  type: integer
                  const: 560048
                origin:
                  type: string
                  format: uri
                message:
                  type: string
                  maxLength: 4096
      responses:
        "200":
          description: Bounded server response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletUserTokens"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/user/auth/session:
    post:
      operationId: walletUserSession
      description: Internal ordinary-session bridge endpoint. The browser uses the same-origin Next API. A verifier proof is accepted only from the configured bridge after cryptographic wallet-message verification. Login grants no sale or transfer authority.
      security:
        - WalletAuthBridge: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
      responses:
        "200":
          description: Bounded server response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - session
                properties:
                  session:
                    $ref: "#/components/schemas/WalletUserSession"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/user/auth/refresh:
    post:
      operationId: walletUserRefresh
      description: Internal ordinary-session bridge endpoint. The browser uses the same-origin Next API. A verifier proof is accepted only from the configured bridge after cryptographic wallet-message verification. Login grants no sale or transfer authority.
      security:
        - WalletAuthBridge: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Bounded server response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletUserTokens"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/user/auth/logout:
    post:
      operationId: walletUserLogout
      description: Internal ordinary-session bridge endpoint. The browser uses the same-origin Next API. A verifier proof is accepted only from the configured bridge after cryptographic wallet-message verification. Login grants no sale or transfer authority.
      security:
        - WalletAuthBridge: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: []
              properties:
                accessToken:
                  type: string
                refreshToken:
                  type: string
      responses:
        "204":
          description: Durable revocation confirmed
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/orders:
    get:
      operationId: listNativeSignedOrders
      description: Public immutable sale authorizations in original publication order. Chain state remains authoritative for fillability. Missing persistence is not an empty account.
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum:
              - whole
              - fraction
