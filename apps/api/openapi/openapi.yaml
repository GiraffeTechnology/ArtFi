        metadataSha256: { type: string, pattern: "^0x[0-9a-f]{64}$" }
        contractFunction:
          {
            type: string,
            const: "createAssetWithEvidence(bytes32,address,string,bytes32,(bytes32,bytes32,bytes32,bytes32,bytes32,uint64,uint64,bytes32,bytes32),bytes32,bytes32)",
          }
        contractArguments:
          description: First four scalar arguments; append the verified contractEvidence tuple and sourceEvidence.signatureR/signatureS for the guarded call. Never call the permanently disabled legacy function.
          type: array
          minItems: 4
          maxItems: 4
          items: { type: string }
        status: { type: string, enum: [prepared, submitted, confirmed, failed] }
        transactionHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        createdAt: { type: string, format: date-time }
    OpenSeaDiscoveryRequest:
      type: object
      additionalProperties: false
      required: [source, chain, contractAddress, tokenId]
      properties:
        source: { type: string, const: opensea }
        chain: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,31}$" }
        contractAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        tokenId: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
    OpenSeaDiscoveryResult:
      type: object
      required:
        [
          checkId,
          source,
          chain,
          contractAddress,
          tokenId,
          result,
          discovered,
          evidenceSha256,
          upstreamStatus,
          observedAt,
        ]
      properties:
        checkId: { type: string, pattern: "^[0-9a-f]{32}$" }
        source: { type: string, const: opensea }
        chain: { type: string }
        contractAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        tokenId: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
        result:
          { type: string, enum: [discovered, not-found, unsupported-chain] }
        discovered: { type: boolean }
        collection: { type: string }
        tokenStandard: { type: string }
        marketplaceUrl:
          { type: string, format: uri, pattern: "^https://opensea\\.io/" }
        evidenceSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        upstreamStatus: { type: integer, minimum: 100, maximum: 599 }
        observedAt: { type: string, format: date-time }
    VaultIntentRequest:
      type: object
      additionalProperties: false
      required:
        [
          collectionAddress,
          tokenId,
          vaultName,
          adminAddress,
          pauserAddress,
          fractionalizerAddress,
        ]
      properties:
        collectionAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        tokenId: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
        vaultName: { type: string, minLength: 2, maxLength: 80 }
        adminAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        pauserAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        fractionalizerAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
    VaultIntent:
      type: object
      required:
        [
          intentId,
          requestId,
          factoryAddress,
          collectionAddress,
          tokenId,
          vaultName,
          adminAddress,
          pauserAddress,
          fractionalizerAddress,
          chainId,
          contractFunction,
          contractArguments,
          status,
          createdAt,
        ]
      properties:
        intentId: { type: string, pattern: "^[0-9a-f]{32}$" }
        requestId: { type: string, pattern: "^0x[0-9a-f]{64}$" }
        factoryAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        collectionAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        tokenId: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
        vaultName: { type: string }
        adminAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        pauserAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        fractionalizerAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        chainId: { type: integer, const: 560048 }
        contractFunction:
          {
            type: string,
            const: "createVault(bytes32,string,address,uint256,address,address,address)",
          }
        contractArguments:
          type: array
          minItems: 7
          maxItems: 7
          items: { type: string }
        status:
          {
            type: string,
            enum:
              [prepared, submitted, created, deposited, fractionalized, failed],
          }
        transactionHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        createdAt: { type: string, format: date-time }
    Asset:
      type: object
      required:
        [
          slug,
          title,
          artist,
          year,
          medium,
          location,
          valuationUsd,
          fractionPriceUsd,
          totalFractions,
          availableFractions,
          status,
          provenance,
        ]
      properties:
        slug: { type: string }
        title: { type: string }
        artist: { type: string }
        year: { type: integer }
        medium: { type: string }
        location: { type: string }
        valuationUsd: { type: integer, minimum: 1 }
        fractionPriceUsd: { type: integer, minimum: 1 }
        totalFractions: { type: integer, minimum: 1 }
        availableFractions: { type: integer, minimum: 0 }
        status: { type: string }
        provenance:
          type: array
          items: { type: string }
    MintedNFT:
      type: object
      required:
        [
          standard,
          collectionAddress,
          tokenId,
          transactionHash,
          blockNumber,
          observedAt,
        ]
      properties:
        standard: { type: string, enum: [ERC-721, ERC-1155] }
        collectionAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        tokenId: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
        holderAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        metadataUri: { type: string, format: uri, pattern: "^https://" }
        transactionHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        blockNumber: { type: integer, minimum: 0 }
        observedAt: { type: string, format: date-time }
    Project:
      type: object
      required: [slug, name, curator, location, assetSlugs, description]
      properties:
        slug: { type: string }
        name: { type: string }
        curator: { type: string }
        location: { type: string }
        assetSlugs:
          type: array
          items: { type: string }
        description: { type: string }
    PortfolioEvent:
      type: object
      required:
        [
          id,
          transactionHash,
          logIndex,
          contractAddress,
          eventName,
          blockNumber,
          status,
          observedAt,
        ]
      properties:
        id:
          {
            type: string,
            description: Stable chain/transaction/log identity; status updates reuse it.,
          }
        transactionHash: { type: string }
        logIndex: { type: integer, minimum: 0 }
        contractAddress: { type: string }
        eventName: { type: string }
        blockNumber: { type: integer, minimum: 0 }
        status: { type: string, enum: [pending, confirmed, removed] }
        observedAt: { type: string, format: date-time }
    PortfolioPerformance:
      type: object
      required:
        [
          status,
          method,
          scope,
          items,
          unmappedTradeCount,
          pendingEventCount,
          reasons,
        ]
      properties:
        status:
          {
            type: string,
            enum: [no_indexed_history, known_for_indexed_history, unknown],
          }
        method: { type: string, const: fifo }
        scope: { type: string, const: confirmed_indexed_fraction_trades }
        unmappedTradeCount: { type: integer, minimum: 0 }
        pendingEventCount: { type: integer, minimum: 0 }
        reasons:
          type: array
          items: { type: string }
        items:
          type: array
          items:
            type: object
            required:
              [
                assetToken,
                paymentToken,
                confirmedQuantity,
                costBasis,
                realizedPnl,
                status,
                buyCount,
                sellCount,
                reasons,
              ]
            properties:
              assetToken: { type: string }
              paymentToken:
                {
                  type: [string, "null"],
                  description: Payment currency address. No conversion is performed.,
                }
              confirmedQuantity:
                {
                  type: [string, "null"],
                  description: Exact unscaled confirmed indexed token quantity; null if invalid.,
                }
              costBasis:
                {
                  type: [string, "null"],
                  description: Remaining FIFO basis in payment-token base units; null if incomplete.,
                }
              realizedPnl:
                {
                  type: [string, "null"],
                  description: Signed exact payment-token base units; null if incomplete. Gas is excluded.,
                }
              status: { type: string, enum: [known, unknown] }
              buyCount: { type: integer, minimum: 0 }
              sellCount: { type: integer, minimum: 0 }
              reasons:
                type: array
                items: { type: string }
    Portfolio:
      type: object
      required:
        [
          address,
          chainId,
          network,
          positions,
          transactions,
          offers,
          notifications,
          performance,
        ]
      properties:
        address: { type: string }
        chainId: { type: integer, const: 560048 }
        network: { type: string, const: hoodi }
        positions:
          type: array
          items:
            type: object
            required: [assetToken, symbol, balance, updatedAt]
            properties:
              assetToken: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
              symbol: { type: string, maxLength: 12 }
              balance:
                {
                  type: string,
                  pattern: "^-?(0|[1-9][0-9]*)$",
                  description: Unscaled indexed transfer balance. A negative value indicates incomplete history.,
                }
              updatedAt: { type: string, format: date-time }
        transactions:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PortfolioEvent"
        offers:
          type: array
          items: { type: object }
        notifications:
          type: array
          maxItems: 100
          description: Direct wallet-participant events ordered by latest indexed update, including pending and removed events. No external delivery or subscription.
          items:
            allOf:
              - $ref: "#/components/schemas/PortfolioEvent"
              - type: object
                required: [message]
                properties:
                  message: { type: string }
        performance:
          $ref: "#/components/schemas/PortfolioPerformance"
    ChainEventRequest:
      type: object
      additionalProperties: false
      required:
        [
          chainId,
          transactionHash,
          logIndex,
          blockNumber,
          blockHash,
          contractAddress,
          eventName,
          payload,
          removed,
          confirmations,
        ]
      properties:
        chainId: { type: integer, const: 560048 }
        transactionHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        logIndex: { type: integer, minimum: 0 }
        blockNumber: { type: integer, minimum: 0 }
        blockHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        contractAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        eventName: { type: string, minLength: 2, maxLength: 80 }
        payload: { type: object }
        removed: { type: boolean }
        confirmations: { type: integer, minimum: 0 }
    ExternalMarketEventRequest:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          source,
          eventType,
          eventFamily,
          entityKey,
          version,
          chain,
          eventTimestamp,
          payload,
        ]
      properties:
        schemaVersion: { type: string, const: "1" }
        source: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }
        eventType: { type: string, maxLength: 48 }
        eventFamily: { type: string, enum: [order, sale, transfer, metadata] }
        entityKey: { type: string, maxLength: 196 }
        version: { type: integer, minimum: 1 }
        chain: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }
        collectionSlug: { type: string, maxLength: 160 }
        orderHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        transactionHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        contractAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        tokenId: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
        makerAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        price: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
        paymentTokenAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        paymentSymbol: { type: string, maxLength: 16 }
        marketplaceUrl: { type: string, format: uri }
        eventTimestamp: { type: string, format: date-time }
        payload: { type: object }
    ExternalMarketActivity:
      allOf:
        - $ref: "#/components/schemas/ExternalMarketEventRequest"
        - type: object
          required: [eventId]
          properties:
            eventId: { type: string, pattern: "^[0-9a-f]{64}$" }
    ExternalMarketAsset:
      type: object
      required:
        [
          source,
          chain,
          contractAddress,
          tokenId,
          latestEventType,
          latestEventTimestamp,
        ]
      properties:
        source: { type: string }
        chain: { type: string }
        contractAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        tokenId: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
        collectionSlug: { type: string }
        latestEventType: { type: string }
        latestEventTimestamp: { type: string, format: date-time }
        orderHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        orderStatus:
          { type: string, enum: [active, cancelled, invalidated, fulfilled] }
        price: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
        paymentSymbol: { type: string }
        marketplaceUrl: { type: string, format: uri }
    ExternalMarketIntentRequest:
      type: object
      additionalProperties: false
      required: [source, action, chain, orderHash, walletAddress]
      properties:
        source: { type: string, const: opensea }
        action: { type: string, const: fulfill-listing }
        chain: { type: string }
        orderHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        walletAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
    ExternalMarketTransaction:
      type: object
      additionalProperties: false
      required: [chain, to, data, value]
      properties:
        chain: { type: string }
        to: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        data: { type: string, pattern: "^0x(?:[0-9a-fA-F]{2})*$" }
        value: { type: string, pattern: "^(0|[1-9][0-9]*)$" }
        valueHex: { type: string, pattern: "^0x(?:[0-9a-fA-F]{2})*$" }
    ExternalMarketIntent:
      allOf:
        - $ref: "#/components/schemas/ExternalMarketIntentRequest"
        - type: object
          required:
            [
              intentId,
              contractAddress,
              tokenId,
              status,
              marketplaceUrl,
              transactions,
              createdAt,
              updatedAt,
            ]
          properties:
            intentId: { type: string, pattern: "^[0-9a-f]{32}$" }
            contractAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
            tokenId: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
            status:
              type: string
              enum:
                [
                  initiated,
                  awaiting-wallet,
                  submitted,
                  accepted,
                  rejected,
                  pending,
                  confirmed,
                  failed,
                  cancelled,
                ]
            marketplaceUrl: { type: string, format: uri }
            transactions:
              type: array
              maxItems: 1
              items: { $ref: "#/components/schemas/ExternalMarketTransaction" }
            transactionHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
            externalTransactionHash:
              { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
            failureCode: { type: string }
            externalEventTimestamp: { type: string, format: date-time }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, detail, requestId]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        requestId: { type: string }
