openapi: 3.1.0
info:
  title: ArtFi API
  version: 0.4.0
  description: Stage 4 Hoodi preview contract. Wallet intents never hold private keys; authenticated indexer writes are durable and replay-safe.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /v1/config:
    get:
      operationId: getConfig
      responses:
        "200":
          description: Safe public runtime configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
  /v1/assets:
    get:
      operationId: listAssets
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: status, in: query, schema: { type: string, maxLength: 40 } }
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        "200":
          description: Asset catalog
          content:
            application/json:
              schema:
                type: object
                required: [data, total, page, pageSize]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Asset"
                  total:
                    type: integer
                    minimum: 0
                  page: { type: integer, minimum: 1 }
                  pageSize: { type: integer, minimum: 1, maximum: 100 }
  /v1/assets/{slug}:
    get:
      operationId: getAsset
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Asset record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/nfts:
    get:
      operationId: listMintedNFTs
      description: Runtime Hoodi mint catalog projected from canonical chain events.
      parameters:
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        "200":
          description: Indexed ERC-721 and ERC-1155 mint records
          content:
            application/json:
              schema:
                type: object
                required: [data, total, page, pageSize, chainId, runtime]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MintedNFT"
                  total: { type: integer, minimum: 0 }
                  page: { type: integer, minimum: 1 }
                  pageSize: { type: integer, minimum: 1, maximum: 100 }
                  chainId: { type: integer, const: 560048 }
                  runtime: { type: boolean, const: true }
  /v1/projects:
    get:
      operationId: listProjects
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - {
            name: page,
            in: query,
            schema: { type: integer, minimum: 1, default: 1 },
          }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        "200":
          description: Curated projects
          content:
            application/json:
              schema:
                type: object
                required: [data, total, page, pageSize]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Project"
                  total:
                    type: integer
                    minimum: 0
                  page: { type: integer, minimum: 1 }
                  pageSize: { type: integer, minimum: 1, maximum: 100 }
  /v1/portfolio/{address}:
    get:
      operationId: getPortfolio
      description: Read-only Hoodi index projection, not an authoritative wallet balance or complete acquisition history. Only confirmed, non-removed transfer events contribute to positions. Missing persistence or inconsistent retained events return an unavailable response rather than an empty portfolio.
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
            pattern: "^0x[0-9a-fA-F]{40}$"
      responses:
        "200":
          description: Read-only public address portfolio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Portfolio"
        "400":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/indexer/events:
    post:
      operationId: ingestChainEvent
      parameters:
        - name: X-Indexer-Key
          in: header
          required: true
          schema: { type: string, minLength: 16 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChainEventRequest"
      responses:
        "201": { description: Canonical event created }
        "200":
          {
            description: Replay,
            confirmation update,
            removal,
            or reorg replacement recorded,
          }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/indexer/market-events:
    post:
      operationId: ingestExternalMarketEvent
      description: Credential-gated ingestion for normalized, read-only events from approved marketplaces.
      parameters:
        - name: X-Indexer-Key
          in: header
          required: true
          schema: { type: string, minLength: 16 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalMarketEventRequest"
      responses:
        "201": { description: External marketplace event mirrored }
        "200": { description: Idempotent replay accepted }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /v1/indexer/market-observations:
    post:
      operationId: recordMarketObservation
      description: Record collection history coverage only after all pages have been durably ingested. This is not live order validation or proof of a healthy stream.
      parameters:
        - name: X-Indexer-Key
          in: header
          required: true
          schema: { type: string, minLength: 16 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketObservationRequest" }
      responses:
        "200":
          description: Observation recorded without regressing a newer observation
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: recorded }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/market/observations:
    get:
      operationId: getMarketObservations
      description: Uncached collection history synchronization observations. Missing collections have unknown freshness; recent history does not validate current listings.
      parameters:
        - name: source
          in: query
          schema: { type: string, default: opensea }
      responses:
        "200":
          description: Source history observations evaluated at asOf
          content:
            application/json:
              schema:
                type: object
                required:
                  [schemaVersion, source, runtime, data, asOf, maxAgeSeconds]
                properties:
                  schemaVersion: { type: string, const: "1" }
                  source: { type: string }
                  runtime: { type: boolean, const: true }
                  data:
                    type: array
                    maxItems: 1000
                    items: { $ref: "#/components/schemas/MarketObservation" }
                  asOf: { type: string, format: date-time }
                  maxAgeSeconds: { type: integer, const: 90 }
        "400": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/indexer/market-streams:
    post:
      operationId: recordMarketStream
      description: Credential-gated transport snapshot for configured collection scopes. Open transport is not proof of channel subscription, delivery or complete history. Newer observation time wins; equal and older writes do not refresh receipt time.
      parameters:
        - name: X-Indexer-Key
          in: header
          required: true
          schema: { type: string, minLength: 16 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketStreamRequest" }
      responses:
        "200":
          description: Transport snapshot recorded
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: recorded }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/market/streams:
    get:
      operationId: getMarketStreams
      description: Uncached transport observations, aged independently of REST coverage. Empty data means unknown; a fresh observation may report disconnection. Never infer actual subscription delivery from transportState.
      parameters:
        - name: source
          in: query
          schema: { type: string, default: opensea }
      responses:
        "200":
          description: Per-collection transport observations
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    schemaVersion,
                    source,
                    runtime,
                    scope,
                    data,
                    asOf,
                    maxAgeSeconds,
                  ]
                properties:
                  schemaVersion: { type: string, const: "1" }
                  source: { type: string }
                  runtime: { type: boolean, const: true }
                  scope: { type: string, const: transport-only }
                  data:
                    type: array
                    maxItems: 1000
                    items:
                      { $ref: "#/components/schemas/MarketStreamObservation" }
                  asOf: { type: string, format: date-time }
                  maxAgeSeconds: { type: integer, const: 90 }
        "400": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/indexer/market-listings:
    post:
      operationId: recordCurrentMarketListing
      description: Credential-gated normalized public listing observations from the SIN collector. No raw provider payloads, signatures or execution plans are accepted. Older or equal observation times do not replace the stored row.
      parameters:
        - name: X-Indexer-Key
          in: header
          required: true
          schema: { type: string, minLength: 16 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CurrentMarketListing" }
      responses:
        "200":
          description: Listing observation recorded
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: recorded }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/market/listing:
    get:
      operationId: getCurrentMarketListing
      description: Uncached provider observation bound to an exact token. Missing or stale observations do not prove absence of listings. This endpoint never creates a transaction.
      parameters:
        - name: source
          in: query
          schema: { type: string, const: opensea, default: opensea }
        - name: chain
          in: query
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }
        - name: contract
          in: query
          required: true
          schema: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        - name: tokenId
          in: query
          required: true
          schema: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
      responses:
        "200":
          description: Current provider observation or an explicit unknown result
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    schemaVersion,
                    source,
                    chain,
                    contractAddress,
                    tokenId,
                    runtime,
                    custody,
                    execution,
                    data,
                    freshness,
                    asOf,
                    maxAgeSeconds,
                  ]
                properties:
                  schemaVersion: { type: string, const: "1" }
                  source: { type: string, const: opensea }
                  chain: { type: string }
                  contractAddress: { type: string }
                  tokenId: { type: string }
                  runtime: { type: boolean, const: true }
                  custody: { type: boolean, const: false }
                  execution: { type: string, const: disabled }
                  data:
                    oneOf:
                      - { $ref: "#/components/schemas/CurrentMarketListing" }
                      - { type: "null" }
                  freshness: { type: string, enum: [fresh, stale, unknown] }
                  asOf: { type: string, format: date-time }
                  maxAgeSeconds: { type: integer, const: 90 }
        "400": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/market/activity:
    get:
      operationId: getExternalMarketActivity
      description: Read-only, cursor-paginated activity mirrored from approved external marketplaces; execution remains external. Follow nextCursor until absent for the complete retained history.
      parameters:
        - name: source
          in: query
          schema: { type: string, default: opensea }
        - name: contract
          in: query
          schema: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        - name: chain
          in: query
          description: Marketplace chain name for an exact asset-history query.
          schema: { type: string }
        - name: tokenId
          in: query
          description: Decimal token ID for an exact asset-history query.
          schema: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: Opaque nextCursor from the preceding page; bound to the same source, chain, contract and token ID.
          schema: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Attributed external marketplace activity
          content:
            application/json:
              schema:
                type: object
                required:
                  [data, schemaVersion, source, execution, custody, runtime]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExternalMarketActivity"
                  schemaVersion: { type: string, const: "1" }
                  source: { type: string }
                  execution: { type: string, const: external-deeplink-only }
                  custody: { type: boolean, const: false }
                  runtime: { type: boolean, const: true }
                  nextCursor:
                    type: string
                    description: Present only when another page of the same query is available.
        "400": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/market/assets:
    get:
      operationId: getExternalMarketAssets
      description: Paginated, deduplicated NFT catalog derived only from attributed external-market runtime events.
      parameters:
        - name: source
          in: query
          schema: { type: string, default: opensea }
        - name: contract
          in: query
          schema: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        - name: chain
          in: query
          description: Bind the catalog lookup to the marketplace chain name.
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }
        - name: tokenId
          in: query
          description: Canonical decimal uint256 token ID; use with chain and contract for exact-token lookup.
          schema: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Complete runtime-backed page of mirrored NFTs
          content:
            application/json:
              schema:
                type: object
                required:
                  [data, total, page, pageSize, schemaVersion, source, runtime]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ExternalMarketAsset" }
                  total: { type: integer, minimum: 0 }
                  page: { type: integer, minimum: 1 }
                  pageSize: { type: integer, minimum: 1, maximum: 100 }
                  schemaVersion: { type: string, const: "1" }
                  source: { type: string }
                  runtime: { type: boolean, const: true }
        "400": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/market/intents:
    post:
      operationId: createExternalMarketIntent
      description: Build an unsigned, same-chain OpenSea fulfillment plan. The external wallet and OpenSea/Seaport retain signing and execution.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExternalMarketIntentRequest" }
      responses:
        "201":
          description: Safe unsigned transaction plan prepared for external-wallet review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalMarketIntent" }
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalMarketIntent" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/market/intents/{intentID}:
    get:
      operationId: getExternalMarketIntent
      parameters:
        - name: intentID
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{32}$" }
      responses:
        "200":
          description: Current state reconciled from wallet submission and external-market events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalMarketIntent" }
        "404": { $ref: "#/components/responses/Problem" }
  /v1/market/intents/{intentID}/submission:
    post:
      operationId: recordExternalMarketSubmission
      parameters:
        - name: intentID
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{32}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [transactionHash]
              properties:
                transactionHash:
                  { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
      responses:
        "200":
          description: External-wallet submission recorded for authoritative event reconciliation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExternalMarketIntent" }
        "409": { $ref: "#/components/responses/Problem" }
  /v1/governance/config:
    get:
      operationId: getGovernanceConfig
      description: Hoodi RWA DAO addresses and immutable policy thresholds. Disabled unless every address is valid.
      responses:
        "200":
          description: Governance deployment configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GovernanceConfig"
  /v1/governance/proposals:
    get:
      operationId: getGovernanceProposals
      description: Durable chain-indexed governance proposals. No fixture fallback is permitted.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Indexed governance proposal records
          content:
            application/json:
              schema:
                type: object
                required: [data, membershipAuthority, schemaVersion]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/GovernanceProposal" }
                  membershipAuthority:
                    { type: string, const: onchain-rwa-token-snapshot }
                  schemaVersion: { type: string, const: "1" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/uploads/intents:
    post:
      operationId: createUploadIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadIntentRequest"
      responses:
        "201":
          description: Short-lived digest-bound API upload intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadIntent"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /v1/uploads/{uploadID}:
    put:
      operationId: uploadObject
      parameters:
        - name: uploadID
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{32}$" }
        - name: Content-SHA256
          in: header
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "204": { description: Object digest verified and persisted }
        "400":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/rwa/intents:
    post:
      operationId: createMintIntent
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintIntentRequest"
      responses:
        "201":
          description: New immutable metadata and contract-call intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintIntent"
        "200":
          description: Idempotent replay of an existing intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintIntent"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
  /v1/rwa/intents/{intentID}:
    get:
      operationId: getMintIntent
      parameters:
        - $ref: "#/components/parameters/IntentID"
      responses:
        "200":
          description: Mint transaction lifecycle snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintIntent"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/rwa/intents/{intentID}/submission:
    post:
      operationId: recordMintSubmission
      parameters:
        - $ref: "#/components/parameters/IntentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionHash]
              properties:
                transactionHash:
                  { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
      responses:
        "200":
          description: Submitted transaction attached idempotently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintIntent"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/rwa/discovery-checks:
    post:
      operationId: checkOpenSeaDiscovery
      description: Operator-authenticated, server-side OpenSea NFT discovery check. The API key and raw upstream payload remain private; the result and payload digest are recorded durably.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenSeaDiscoveryRequest"
      responses:
        "200":
          description: Discovery evidence recorded, including explicit not-found or unsupported-chain outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenSeaDiscoveryResult"
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/fractionals:
    get:
      operationId: getFractionalCatalog
      description: Read-only Hoodi issuance records from confirmed non-removed Fractionalized events linked to VaultCreated by the configured factory. Indexed evidence only, not live custody, holdings, price or judicial-rights verification. No fixture fallback.
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 } }
      responses:
        "200":
          description: Indexed fund-token issuance page; empty nextCursor means no further retained rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FractionalCatalogPage"
        "400": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /v1/vault/intents:
    post:
      operationId: createVaultIntent
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultIntentRequest"
      responses:
        "201":
          description: New VaultFactory transaction intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultIntent"
        "200":
          description: Idempotent replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultIntent"
        "409":
          $ref: "#/components/responses/Problem"
  /v1/vault/intents/{intentID}:
    get:
      operationId: getVaultIntent
      parameters:
        - $ref: "#/components/parameters/IntentID"
      responses:
        "200":
          description: Vault transaction lifecycle snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultIntent"
        "404":
          $ref: "#/components/responses/Problem"
  /v1/vault/intents/{intentID}/submission:
    post:
      operationId: recordVaultSubmission
      parameters:
        - $ref: "#/components/parameters/IntentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionHash]
              properties:
                transactionHash:
                  { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
      responses:
        "200":
          description: Submitted VaultFactory transaction attached idempotently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultIntent"
components:
  parameters:
    IntentID:
      name: intentID
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9a-f]{32}$" }
  responses:
    Problem:
      description: RFC 9457-style request failure
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    FractionalCatalogPage:
      type: object
      additionalProperties: false
      required:
        [data, nextCursor, chainId, factoryAddress, runtime, readOnly, evidence]
      properties:
        data:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/FractionalCatalogRecord" }
        nextCursor: { type: string, maxLength: 512 }
        chainId: { type: integer, const: 560048 }
        factoryAddress: { type: string, pattern: "^0x[0-9a-f]{40}$" }
        runtime: { type: boolean, const: true }
        readOnly: { type: boolean, const: true }
        evidence: { type: string, const: indexed-confirmed-events }
    FractionalCatalogRecord:
      type: object
      additionalProperties: false
      required:
        [
          eventId,
          vaultAddress,
          collectionAddress,
          tokenId,
          vaultName,
          fractionTokenAddress,
          supply,
          issuanceRecipient,
          transactionHash,
          blockHash,
          blockNumber,
          logIndex,
          observedAt,
        ]
      properties:
        eventId: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
        vaultAddress: { type: string, pattern: "^0x[0-9a-f]{40}$" }
        collectionAddress: { type: string, pattern: "^0x[0-9a-f]{40}$" }
        tokenId: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
        vaultName: { type: string, minLength: 2, maxLength: 80 }
        fractionTokenAddress: { type: string, pattern: "^0x[0-9a-f]{40}$" }
        supply: { type: string, pattern: "^[1-9][0-9]{0,77}$" }
        issuanceRecipient: { type: string, pattern: "^0x[0-9a-f]{40}$" }
        transactionHash: { type: string, pattern: "^0x[0-9a-f]{64}$" }
        blockHash: { type: string, pattern: "^0x[0-9a-f]{64}$" }
        blockNumber: { type: string, pattern: "^(0|[1-9][0-9]{0,19})$" }
        logIndex: { type: integer, minimum: 0, maximum: 4294967295 }
        observedAt: { type: string, format: date-time }
    Status:
      type: object
      required: [service, status, version]
      properties:
        service: { type: string }
        status: { type: string }
        version: { type: string }
    Config:
      type: object
      required: [api, chainId, mode, network, readOnly, writeEnabled]
      properties:
        api: { type: string, const: v1 }
        chainId: { type: integer, const: 560048 }
        mode: { type: string, const: preview }
        network: { type: string, const: hoodi }
        readOnly: { type: boolean }
        writeEnabled: { type: boolean }
        registryAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        vaultFactoryAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
    GovernanceConfig:
      type: object
      required:
        [
          approvalPpm,
          chainId,
          enabled,
          membershipAuthority,
          proposalThresholdPpm,
        ]
      properties:
        actionRegistryAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        approvalPpm:
          type: object
          required: [marketMigration, physicalAction, forcedBuyout]
          properties:
            marketMigration: { type: integer, const: 500000 }
            physicalAction: { type: integer, const: 666667 }
            forcedBuyout: { type: integer, const: 800000 }
        chainId: { type: integer, const: 560048 }
        enabled: { type: boolean }
        governorAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        membershipAuthority: { type: string, const: onchain-rwa-token-snapshot }
        proposalThresholdPpm: { type: integer, const: 100000 }
        tokenAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        vaultAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
    GovernanceProposal:
      type: object
      required:
        [
          actionTarget,
          approvalNumerator,
          approvalDenominator,
          governorAddress,
          proposalId,
          proposalKind,
          proposerAddress,
          rwaVerified,
          status,
          voteStart,
          voteEnd,
        ]
      properties:
        actionTarget: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        approvalNumerator: { type: integer, enum: [500000, 666667, 800000] }
        approvalDenominator: { type: integer, const: 1000000 }
        evidenceHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        evidenceUri: { type: string, format: uri }
        governorAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        proposalId: { type: string }
        proposalKind:
          {
            type: string,
            enum: [market_migration, physical_action, forced_buyout],
          }
        proposerAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        rwaVerified: { type: boolean }
        status:
          {
            type: string,
            enum:
              [
                pending,
                active,
                defeated,
                succeeded,
                queued,
                executed,
                cancelled,
              ],
          }
        voteStart: { type: integer, minimum: 0 }
        voteEnd: { type: integer, minimum: 0 }
    UploadIntentRequest:
      type: object
      additionalProperties: false
      required: [fileName, contentType, sha256, size]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 120 }
        contentType: { type: string, enum: [image/png, image/jpeg, image/webp] }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        size: { type: integer, minimum: 1, maximum: 10485760 }
    UploadIntent:
      type: object
      required:
        [uploadId, uploadUrl, method, expiresAt, maxBytes, requiredHeaders]
      properties:
        uploadId: { type: string, pattern: "^[0-9a-f]{32}$" }
        uploadUrl: { type: string }
        method: { type: string, const: PUT }
        expiresAt: { type: string, format: date-time }
        maxBytes: { type: integer, const: 10485760 }
        requiredHeaders:
          type: object
          additionalProperties: { type: string }
    MintIntentRequest:
      type: object
      additionalProperties: false
      required:
        [uploadId, recipient, name, artist, year, medium, location, description]
      properties:
        uploadId: { type: string, pattern: "^[0-9a-f]{32}$" }
        recipient: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        name: { type: string, minLength: 2, maxLength: 120 }
        artist: { type: string, minLength: 2, maxLength: 120 }
        year: { type: integer, minimum: 1000 }
        medium: { type: string, minLength: 2, maxLength: 160 }
        location: { type: string, minLength: 2, maxLength: 160 }
        description: { type: string, minLength: 20, maxLength: 2000 }
    MintIntent:
      type: object
      required:
        [
          intentId,
          requestId,
          recipient,
          registryAddress,
          chainId,
          metadataUri,
          metadataSha256,
          contractFunction,
          contractArguments,
          status,
          createdAt,
        ]
      properties:
        intentId: { type: string, pattern: "^[0-9a-f]{32}$" }
        requestId: { type: string, pattern: "^0x[0-9a-f]{64}$" }
        recipient: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        registryAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        chainId: { type: integer, const: 560048 }
        metadataUri: { type: string, format: uri, pattern: "^https://" }
        metadataSha256: { type: string, pattern: "^0x[0-9a-f]{64}$" }
        contractFunction:
          { type: string, const: "createAsset(bytes32,address,string,bytes32)" }
        contractArguments:
          type: array
          minItems: 4
          maxItems: 4
          items: { type: string }
        status: { type: string, enum: [prepared, submitted, confirmed, failed] }
        transactionHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        createdAt: { type: string, format: date-time }
    OpenSeaDiscoveryRequest:
      type: object
      additionalProperties: false
      required: [source, chain, contractAddress, tokenId]
      properties:
        source: { type: string, const: opensea }
        chain: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,31}$" }
        contractAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        tokenId: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
    OpenSeaDiscoveryResult:
      type: object
      required:
        [
          checkId,
          source,
          chain,
          contractAddress,
          tokenId,
          result,
          discovered,
          evidenceSha256,
          upstreamStatus,
          observedAt,
        ]
      properties:
        checkId: { type: string, pattern: "^[0-9a-f]{32}$" }
        source: { type: string, const: opensea }
        chain: { type: string }
        contractAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        tokenId: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
        result:
          { type: string, enum: [discovered, not-found, unsupported-chain] }
        discovered: { type: boolean }
        collection: { type: string }
        tokenStandard: { type: string }
        marketplaceUrl:
          { type: string, format: uri, pattern: "^https://opensea\\.io/" }
        evidenceSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        upstreamStatus: { type: integer, minimum: 100, maximum: 599 }
        observedAt: { type: string, format: date-time }
    VaultIntentRequest:
      type: object
      additionalProperties: false
      required:
        [
          collectionAddress,
          tokenId,
          vaultName,
          adminAddress,
          pauserAddress,
          fractionalizerAddress,
        ]
      properties:
        collectionAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        tokenId: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
        vaultName: { type: string, minLength: 2, maxLength: 80 }
        adminAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        pauserAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        fractionalizerAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
    VaultIntent:
      type: object
      required:
        [
          intentId,
          requestId,
          factoryAddress,
          collectionAddress,
          tokenId,
          vaultName,
          adminAddress,
          pauserAddress,
          fractionalizerAddress,
          chainId,
          contractFunction,
          contractArguments,
          status,
          createdAt,
        ]
      properties:
        intentId: { type: string, pattern: "^[0-9a-f]{32}$" }
        requestId: { type: string, pattern: "^0x[0-9a-f]{64}$" }
        factoryAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        collectionAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        tokenId: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" }
        vaultName: { type: string }
        adminAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        pauserAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        fractionalizerAddress: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        chainId: { type: integer, const: 560048 }
        contractFunction:
          {
            type: string,
            const: "createVault(bytes32,string,address,uint256,address,address,address)",
          }
        contractArguments:
          type: array
          minItems: 7
          maxItems: 7
          items: { type: string }
        status:
          {
            type: string,
            enum:
              [prepared, submitted, created, deposited, fractionalized, failed],
          }
        transactionHash: { type: string, pattern: "^0x[0-9a-fA-F]{64}$" }
        createdAt: { type: string, format: date-time }
    Asset:
      type: object
      required:
        [
          slug,
          title,
          artist,
          year,
          medium,
          location,
          valuationUsd,
          fractionPriceUsd,
          totalFractions,
          availableFractions,
          status,
          provenance,
        ]
