  /v1/market/activity:
    get:
      operationId: getExternalMarketActivity
      description: Read-only activity mirrored from approved external marketplaces; execution remains external.
      parameters:
        - name: source
          in: query
          schema: { type: string, default: opensea }
        - name: contract
          in: query
          schema: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: >-
            Opaque position from a previous response's nextCursor. Keyset, not an offset: a feed
            that grows at its head would make offset paging skip and repeat rows. A cursor this
            endpoint did not issue is refused rather than rounded to the start.
          schema: { type: string, maxLength: 256 }
      responses:
        "200":
          description: Attributed external marketplace activity
          content:
            application/json:
              schema:
                type: object
                required: [data, schemaVersion, source, execution, custody]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ExternalMarketActivity"
                  schemaVersion: { type: string, const: "1" }
                  source: { type: string }
                  execution: { type: string, const: external-deeplink-only }
                  custody: { type: boolean, const: false }
                  nextCursor:
                    type: string
                    description: >-
                      Position to pass as cursor for the next page. Absent once the history has
                      ended, so its absence is the end rather than something to infer from a short
                      page.
        "400": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
