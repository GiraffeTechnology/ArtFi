        slug: { type: string }
        title: { type: string }
        artist: { type: string }
        year: { type: integer }
        medium: { type: string }
        location: { type: string }
        valuationUsd: { type: integer, minimum: 1 }
        fractionPriceUsd: { type: integer, minimum: 1 }
        totalFractions: { type: integer, minimum: 1 }
        availableFractions: { type: integer, minimum: 0 }
        status: { type: string }
        provenance:
          type: array
