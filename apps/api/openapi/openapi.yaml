    post:
      operationId: recordSignedRWASourceRevocation
      description:
        Public signature-authenticated source endpoint. Permanent, replay-safe revocation, serialized atomically
        with activation. No ArtFi role can manufacture the source signature. Application receipt does not itself submit
        an on-chain revocation.
