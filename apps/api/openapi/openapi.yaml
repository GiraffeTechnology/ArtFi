  /v1/rwa/underlying-status:
    get:
      operationId: checkCurrentRWAUnderlyingGrounding
      description: No-store current approved-source correspondence check for an exact underlying, before new fraction issuance. Does not block owner exits or imply current registry holdership.
      parameters:
        - {
            name: chainId,
            in: query,
            required: true,
            schema: { type: integer, const: 560048 },
          }
        - {
            name: collectionAddress,
            in: query,
            required: true,
            schema: { type: string, pattern: "^0x[0-9a-fA-F]{40}$" },
          }
        - {
            name: tokenId,
            in: query,
            required: true,
            schema: { type: string, pattern: "^(0|[1-9][0-9]{0,77})$" },
          }
      responses:
        "200":
          description: Exact underlying currently has active approved-source evidence
          content:
            application/json:
              schema:
                type: object
                required:
                  [chainId, collectionAddress, tokenId, grounded, checkedAt]
                properties:
                  chainId: { type: integer, const: 560048 }
                  collectionAddress: { type: string }
                  tokenId: { type: string }
                  grounded: { type: boolean, const: true }
                  checkedAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    OperatorBearer:
      type: http
      scheme: bearer
      description: Server-only operator gateway credential; never browser-visible. Does not establish source authenticity.
    WalletAuthBridge:
      type: http
      scheme: bearer
      description: Server-only configured bridge credential. Never returned to browser code.
    WalletUserSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IntentID:
      name: intentID
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9a-f]{32}$" }
  responses:
    Problem:
      description: RFC 9457-style request failure
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ApprovedRWASource:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - kind
        - publicKeyX
        - publicKeyY
        - mode
        - registryBacked
        - disabled
      properties:
        id:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
        name:
          type: string
          minLength: 2
          maxLength: 160
        kind:
          type: string
          enum:
            - registry
            - warehouse
            - custody
            - certificate
            - provenance
        publicKeyX:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
        publicKeyY:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
        mode:
          type: string
          enum:
            - LIVE
            - TEST_ONLY
        registryBacked:
          type: boolean
        disabled:
          type: boolean
    RWARegistryRecord:
      type: object
      additionalProperties: false
      required:
        - reference
        - version
        - observedAt
      properties:
        reference:
          type: string
          minLength: 1
          maxLength: 512
        version:
          type: string
          minLength: 1
          maxLength: 128
        observedAt:
          type: integer
          minimum: 1
          description: Source registry observation, Unix seconds. This is a source claim, not a chain ownership assertion.
    RWASourceEvidence:
      type: object
      additionalProperties: false
      required:
        - sourceId
        - sourceAssetId
        - evidenceId
        - underlyingAssetId
        - section
        - mode
        - sourceReference
        - evidenceSha256
        - rights
        - validFrom
        - validUntil
        - contextHash
        - signatureR
        - signatureS
      properties:
        sourceId:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
        sourceAssetId:
          type: string
          minLength: 1
          maxLength: 256
        evidenceId:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
        underlyingAssetId:
          type: string
          minLength: 3
          maxLength: 256
        section:
          type: string
          enum:
            - whole
            - fractional
        mode:
          type: string
          enum:
            - LIVE
            - TEST_ONLY
        sourceReference:
          type: string
          minLength: 1
          maxLength: 512
        evidenceSha256:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
        rights:
          type: string
          minLength: 20
          maxLength: 4000
        registryRecord:
          $ref: "#/components/schemas/RWARegistryRecord"
        validFrom:
          type: integer
          minimum: 1
        validUntil:
          type: integer
          minimum: 1
        contextHash:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
        signatureR:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
        signatureS:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
    RWAContractEvidence:
      type: object
      additionalProperties: false
      required:
        - sourceIdHash
        - sourceAssetHash
        - assetKey
        - evidenceId
        - claimHash
        - validFrom
        - validUntil
        - modeHash
        - sectionHash
      properties:
        sourceIdHash:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
        sourceAssetHash:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
        assetKey:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
        evidenceId:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
        claimHash:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
        validFrom:
          type: integer
          minimum: 1
        validUntil:
          type: integer
          minimum: 1
        modeHash:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
        sectionHash:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
    RWACatalogBinding:
      type: object
      additionalProperties: false
      required:
        - chainId
        - collectionAddress
        - tokenId
        - underlyingAssetId
      properties:
        chainId:
          type: integer
          const: 560048
        collectionAddress:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        tokenId:
          type: string
          pattern: ^(0|[1-9][0-9]{0,77})$
        assetId:
          type: string
          minLength: 1
          maxLength: 256
        underlyingAssetId:
          type: string
          minLength: 3
          maxLength: 256
        fractionTokenAddress:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        vaultAddress:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        marketAddress:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
    RWACatalogRecord:
      type: object
      additionalProperties: false
      required:
        - slug
        - title
        - artist
        - year
        - medium
        - location
        - description
        - section
        - rights
        - provenance
        - binding
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,99}$
        title:
          type: string
          minLength: 2
          maxLength: 120
        artist:
          type: string
          minLength: 2
          maxLength: 120
        year:
          type: integer
          minimum: 1000
        medium:
          type: string
          minLength: 2
          maxLength: 160
        location:
          type: string
          minLength: 2
          maxLength: 160
        description:
          type: string
          minLength: 20
          maxLength: 2000
        imageUrl:
          type: string
          maxLength: 512
          description:
            Optional public HTTPS image URL, or empty. No artwork preview or image prerequisite is created
            by catalog activation.
        section:
          type: string
          enum:
            - whole
            - fractional
        rights:
          type: string
          minLength: 20
          maxLength: 4000
        provenance:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            minLength: 3
            maxLength: 512
        binding:
          $ref: "#/components/schemas/RWACatalogBinding"
    RWAGrounding:
      type: object
      additionalProperties: false
      required:
        - status
        - mode
        - sourceId
        - sourceName
        - sourceKind
        - sourceReference
        - sourceAssetId
        - evidenceId
        - evidenceSha256
        - validFrom
        - validUntil
        - verifiedAt
        - registryBacked
      properties:
        status:
          type: string
          enum:
            - verified
            - expired
            - revoked
            - source-unavailable
            - not-yet-valid
        mode:
          type: string
          enum:
            - LIVE
            - TEST_ONLY
        sourceId:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
        sourceName:
          type: string
        sourceKind:
          type: string
        sourceReference:
          type: string
          minLength: 1
          maxLength: 512
        sourceAssetId:
          type: string
          minLength: 1
          maxLength: 256
        evidenceId:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
        evidenceSha256:
          type: string
          pattern: ^0x[0-9a-fA-F]{64}$
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        verifiedAt:
          type: string
          format: date-time
        registryBacked:
          type: boolean
        registryRecord:
          $ref: "#/components/schemas/RWARegistryRecord"
    RWACatalogAsset:
      type: object
      additionalProperties: false
      required:
        - slug
        - title
        - artist
        - year
        - medium
        - location
        - description
        - imageUrl
        - section
        - rights
        - provenance
        - binding
        - grounding
        - revision
        - createdAt
        - updatedAt
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,99}$
        title:
          type: string
          minLength: 2
          maxLength: 120
        artist:
          type: string
          minLength: 2
          maxLength: 120
        year:
          type: integer
          minimum: 1000
        medium:
          type: string
          minLength: 2
          maxLength: 160
        location:
          type: string
          minLength: 2
          maxLength: 160
        description:
          type: string
          minLength: 20
          maxLength: 2000
        imageUrl:
          type: string
          maxLength: 512
          description:
            Optional public HTTPS image URL, or empty. No artwork preview or image prerequisite is created
            by catalog activation.
        section:
          type: string
          enum:
            - whole
            - fractional
        rights:
          type: string
          minLength: 20
          maxLength: 4000
        provenance:
          type: array
          minItems: 1
          maxItems: 20
