<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ArtFi Wallet Alpha</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 20px;
        background: #11100e;
        color: #f4efe5;
        font:
          14px/1.5 system-ui,
          sans-serif;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      p {
        color: #b9b2a5;
      }
      button {
        width: 100%;
        padding: 10px;
        color: #11100e;
        background: #d9ff5a;
        border: 0;
        border-radius: 6px;
        font-weight: 700;
      }
      code {
        overflow-wrap: anywhere;
      }
      h2 {
        margin: 20px 0 4px;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #b9b2a5;
      }
      ul {
        margin: 0;
        padding-left: 18px;
        color: #b9b2a5;
        overflow-wrap: anywhere;
      }
      #site {
        overflow-wrap: anywhere;
      }
      button + button {
        margin-top: 8px;
      }
      [hidden] {
        display: none !important;
      }
      button {
        overflow-wrap: anywhere;
        white-space: normal;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid #d9ff5a;
        outline-offset: 3px;
      }
      label {
        display: block;
        margin: 10px 0 4px;
        font-size: 12px;
        color: #b9b2a5;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        color: #f4efe5;
        background: #1c1a17;
        border: 1px solid #3a3630;
        border-radius: 6px;
        font: inherit;
      }
      #vault-submit {
        margin-top: 12px;
      }
      #vault-error {
        color: #ffb4a2;
      }
    </style>
  </head>
  <body>
    <h1>ArtFi Wallet Alpha</h1>
    <label for="language" data-popup-message="language">Language</label>
    <select id="language">
      <option value="en">English</option>
    </select>
    <p id="language-status" role="status" aria-live="polite"></p>
    <p lang="en">
      Hoodi only. Signing remains in an approved hardware wallet or
      WalletConnect session.
    </p>
    <p id="translated-boundary" data-popup-message="boundary" hidden></p>
    <p id="status" role="status" aria-live="polite">
      Checking encrypted vault…
    </p>

    <form id="vault-form" hidden>
      <label for="vault-password" id="vault-password-label"
        >Vault password</label
      >
      <input
        id="vault-password"
        type="password"
        autocomplete="current-password"
        minlength="12"
        required
      />
      <div id="vault-account-fields" hidden>
        <label for="vault-address" data-popup-message="account"
          >Account address</label
        >
        <input
          id="vault-address"
          type="text"
          inputmode="latin"
          placeholder="0x…"
          pattern="0x[0-9a-fA-F]{40}"
        />
        <label for="vault-connector" data-popup-message="signer">Signer</label>
        <select id="vault-connector">
          <option value="hardware" data-popup-message="hardware">
            Hardware wallet
          </option>
          <option value="walletconnect">WalletConnect</option>
        </select>
      </div>
      <button id="vault-submit" type="submit">Unlock coordinator</button>
      <p id="vault-error" role="alert" hidden></p>
    </form>

    <h2 data-popup-message="thisSite">This site</h2>
    <p id="site" role="status" aria-live="polite">Reading the active tab…</p>
    <button id="toggle-site" type="button" hidden>Enable for this site</button>

    <h2 data-popup-message="enabledSites">Enabled sites</h2>
    <ul id="grants"></ul>
    <p id="grants-empty" data-popup-message="noSites" hidden>
      No site is enabled.
    </p>

    <h2 data-popup-message="coordinator">Coordinator</h2>
    <button id="lock" type="button" data-popup-message="lock">
      Lock coordinator
    </button>
    <script type="module" src="popup.js"></script>
  </body>
</html>
